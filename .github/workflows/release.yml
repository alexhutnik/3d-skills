name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv run --locked python manage.py verify-tag "$GITHUB_REF_NAME"
      - run: uv run --locked python manage.py package
      - name: Publish the checked release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/publish_release.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
