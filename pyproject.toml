[project]
name = "three-d-skills"
version = "1.0.0"
description = "Reusable CAD skills and independently tested Python tools"
requires-python = ">=3.13,<3.14"
dependencies = ["typer>=0.27.3", "rich>=15.0.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pyyaml>=6.0.3", "ruff>=0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
