[project]
name = "inspect-3d-tools"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "build123d==0.13.0",
    "k3d==3.2.0",
    "numpy>=2.5.4",
    "ocp-viewer==1.2.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "playwright==1.64.0",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires Playwright Chromium"]
