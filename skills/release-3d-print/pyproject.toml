[project]
name = "release-3d-print-tools"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["build123d==0.13.0", "trimesh==5.1.1", "numpy>=2,<3", "scipy>=1.16,<2", "networkx>=3,<4", "typer>=0.27.3", "rich>=15.0.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
